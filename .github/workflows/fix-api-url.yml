name: Fix API URLs
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  replace-url:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Replace your-url.com
        run: |
          FILE="RockyTap/RockyTap/assets/index-BYqAG32B.js"
          if [ ! -f "$FILE" ]; then
            echo "File not found: $FILE"
            exit 1
          fi
          sed -i 's#https://your-url\.com#https://buzeasy.net#g' "$FILE"
          echo "Remaining your-url.com occurrences:"
          grep -o 'your-url\.com' "$FILE" | wc -l || true
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "RockyTap/RockyTap/assets/index-BYqAG32B.js"
          if git diff --cached --quiet; then
            echo "No changes needed."
          else
            git commit -m "Fix API URL to buzeasy.net"
            git push
          fi
